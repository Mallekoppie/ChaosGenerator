# TLS Secret Template
# 
# To create the TLS secret, generate certificates using the Makefile target:
#   make generate-certs
#
# Then create the Kubernetes secret:
#   kubectl create secret tls target-http-tls \
#     --cert=certs/target-http/tls.crt \
#     --key=certs/target-http/tls.key
#
# Or use this template after base64 encoding your certificate files:
---
apiVersion: v1
kind: Secret
metadata:
  name: target-http-tls
  labels:
    app: target-http
type: kubernetes.io/tls
data:
  # Base64 encoded certificate (tls.crt)
  # Run: cat certs/target-http/tls.crt | base64 -w 0
  tls.crt: <base64-encoded-certificate>
  
  # Base64 encoded private key (tls.key)
  # Run: cat certs/target-http/tls.key | base64 -w 0
  tls.key: <base64-encoded-private-key>
