apiVersion: apps/v1
kind: Deployment
metadata:
  name: target-http
  labels:
    app: target-http
spec:
  replicas: 2
  selector:
    matchLabels:
      app: target-http
  template:
    metadata:
      labels:
        app: target-http
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: target-http
        image: your-registry/target-http:latest
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        env:
        - name: CHAOS_TARGET_PROTOCOL
          value: "http1"
        - name: CHAOS_TARGET_PORT
          value: "8080"
        - name: CHAOS_TARGET_METRICS_PORT
          value: "9090"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
