apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - deployment-tls.yaml
  - deployment-http2.yaml
  - service.yaml
  - servicemonitor.yaml
  # Uncomment to use TLS secret from this file:
  # - secret-tls.yaml

namespace: chaos-testing

commonLabels:
  project: chaos-generator

# One image for every component. Change the registry or the tag here, or with
# `kustomize edit set image ghcr.io/mallekoppie/chaos-generator=<registry>/chaos-generator:<tag>`.
images:
  - name: ghcr.io/mallekoppie/chaos-generator
    newName: ghcr.io/mallekoppie/chaos-generator
    newTag: latest
