apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos-agent
  labels:
    app: chaos-agent
spec:
  replicas: 3
  selector:
    matchLabels:
      app: chaos-agent
  template:
    metadata:
      labels:
        app: chaos-agent
    spec:
      containers:
      - name: chaos-agent
        # One image holds every binary; `command` picks the agent.
        image: ghcr.io/mallekoppie/chaos-generator:latest
        command: ["/chaos-agent"]
        ports:
        # Agents only connect out to the master; this port serves the Prometheus
        # metrics and the /health endpoint the probes use.
        - containerPort: 9091
          name: metrics
          protocol: TCP
        env:
        # Master server address (required in k8s)
        - name: CHAOS_MASTER_ADDRESS
          value: "chaos-master-service:9002"
        
        # Agent port (optional, default: 9001)
        - name: CHAOS_AGENT_PORT
          value: "9001"
        
        # Metrics port (optional, default: 9091)
        - name: CHAOS_AGENT_METRICS_PORT
          value: "9091"
        
        # Agent version (optional, default: 2.0.0)
        - name: CHAOS_AGENT_VERSION
          value: "2.0.0"
        
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        # Liveness probe to ensure agent is running. The image is distroless (no
        # shell), so this uses the /health endpoint of the metrics server instead
        # of an `exec` probe.
        livenessProbe:
          httpGet:
            path: /health
            port: metrics
          initialDelaySeconds: 10
          periodSeconds: 30
        
        # Readiness probe (agent is ready once the metrics server answers). The
        # image is distroless, so httpGet replaces the old `pgrep` exec probe.
        readinessProbe:
          httpGet:
            path: /health
            port: metrics
          initialDelaySeconds: 5
          periodSeconds: 10
