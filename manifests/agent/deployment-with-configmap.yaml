apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos-agent-with-configmap
  labels:
    app: chaos-agent
spec:
  replicas: 3
  selector:
    matchLabels:
      app: chaos-agent
  template:
    metadata:
      labels:
        app: chaos-agent
    spec:
      containers:
      - name: chaos-agent
        # One image holds every binary; `command` picks the agent.
        image: ghcr.io/mallekoppie/chaos-generator:latest
        command: ["/chaos-agent"]
        envFrom:
        - configMapRef:
            name: chaos-agent-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
