apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - configmap.yaml

# Use the basic deployment by default
# For ConfigMap-based deployment, add deployment-with-configmap.yaml instead

namespace: default

commonLabels:
  component: chaos-agent
  
replicas:
  - name: chaos-agent
    count: 3

# One image for every component. Change the registry or the tag here, or with
# `kustomize edit set image ghcr.io/mallekoppie/chaos-generator=<registry>/chaos-generator:<tag>`.
images:
  - name: ghcr.io/mallekoppie/chaos-generator
    newName: ghcr.io/mallekoppie/chaos-generator
    newTag: latest
