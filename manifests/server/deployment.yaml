apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos-master
  labels:
    app: chaos-master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chaos-master
  template:
    metadata:
      labels:
        app: chaos-master
    spec:
      containers:
      - name: chaos-master
        image: your-registry/chaos-master:latest
        ports:
        - containerPort: 9002
          name: grpc
          protocol: TCP
        # Serves the web control panel and the gRPC-Web endpoints.
        - containerPort: 8080
          name: web
          protocol: TCP
        env:
        - name: CHAOS_MASTER_WEB_ADDRESS
          value: "0.0.0.0:8080"
        - name: CHAOS_MASTER_DB_PATH
          value: "/data/chaos_master.db"
        - name: CHAOS_JWT_SIGNING_KEY
          valueFrom:
            secretKeyRef:
              name: chaos-master-secrets
              key: jwtSigningKey
        - name: CHAOS_REGISTER_SECRET
          valueFrom:
            secretKeyRef:
              name: chaos-master-secrets
              key: registerSecret
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: web
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /healthz
            port: web
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: chaos-master-pvc
