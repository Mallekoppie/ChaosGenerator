apiVersion: v1
kind: Secret
metadata:
  name: chaos-master-secrets
  labels:
    app: chaos-master
type: Opaque
stringData:
  # CHANGE THESE before deploying to a real cluster.
  # Signs the local JWTs issued by the Auth service.
  jwtSigningKey: "change-me-in-production"
  # Required to register the first user from the web UI.
  registerSecret: "change-me-in-production"
