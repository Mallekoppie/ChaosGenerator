apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - pvc.yaml
  - secret.yaml
  - service.yaml
  - deployment.yaml

namespace: default

commonLabels:
  component: chaos-master

replicas:
  - name: chaos-master
    count: 1

# One image for every component. Change the registry or the tag here, or with
# `kustomize edit set image ghcr.io/mallekoppie/chaos-generator=<registry>/chaos-generator:<tag>`.
images:
  - name: ghcr.io/mallekoppie/chaos-generator
    newName: ghcr.io/mallekoppie/chaos-generator
    newTag: latest
