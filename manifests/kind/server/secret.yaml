apiVersion: v1
kind: Secret
metadata:
  name: chaos-master-secrets
  labels:
    app: chaos-master
    project: chaos-generator
type: Opaque
stringData:
  # Throwaway values for the local kind cluster - do not reuse them anywhere else.
  # Signs the local JWTs issued by the Auth service.
  jwtSigningKey: "chaos-kind-signing-key-change-me"
  # Required to register the first user from the web UI.
  registerSecret: "chaos-dev-secret"
