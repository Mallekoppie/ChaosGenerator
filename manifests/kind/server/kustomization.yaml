apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: chaos-testing

resources:
  - pvc.yaml
  - secret.yaml
  - service.yaml
  - deployment.yaml

# Repeated in every sub-kustomization so each rendered file (kind-server.yaml,
# kind-agent.yaml, ...) is correct on its own, not just inside kind-all.yaml.
images:
  - name: chaos-master
    newName: __REGISTRY__chaos-master
    newTag: __IMAGE_TAG__

# The master uses BoltDB, so a single replica is the only supported setup.
replicas:
  - name: chaos-master
    count: 1
