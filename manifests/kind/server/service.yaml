apiVersion: v1
kind: Service
metadata:
  name: chaos-master-service
  labels:
    app: chaos-master
    project: chaos-generator
spec:
  type: ClusterIP
  ports:
  - port: 9002
    targetPort: 9002
    protocol: TCP
    name: grpc
  # Web control panel and gRPC-Web endpoints.
  # Access locally with: make kind-port-forward
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: web
  selector:
    app: chaos-master
