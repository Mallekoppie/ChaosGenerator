apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos-master
  labels:
    app: chaos-master
    project: chaos-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chaos-master
  template:
    metadata:
      labels:
        app: chaos-master
        project: chaos-generator
    spec:
      containers:
      - name: chaos-master
        image: chaos-master:latest
        # `make kind-images` loads the locally built image into the node. Without
        # IfNotPresent the injected ":latest" tag defaults to Always, which makes
        # the kubelet try (and fail) to pull chaos-master from a registry.
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9002
          name: grpc
          protocol: TCP
        # Serves the web control panel and the gRPC-Web endpoints.
        - containerPort: 8080
          name: web
          protocol: TCP
        env:
        - name: CHAOS_MASTER_WEB_ADDRESS
          value: "0.0.0.0:8080"
        - name: CHAOS_MASTER_DB_PATH
          value: "/data/chaos_master.db"
        - name: CHAOS_JWT_SIGNING_KEY
          valueFrom:
            secretKeyRef:
              name: chaos-master-secrets
              key: jwtSigningKey
        - name: CHAOS_REGISTER_SECRET
          valueFrom:
            secretKeyRef:
              name: chaos-master-secrets
              key: registerSecret
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: web
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /healthz
            port: web
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: chaos-master-pvc
