apiVersion: apps/v1
kind: Deployment
metadata:
  name: target-http-tls
  labels:
    app: target-http-tls
    project: chaos-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: target-http-tls
  template:
    metadata:
      labels:
        app: target-http-tls
        project: chaos-generator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: target-http-tls
        image: target-http:latest
        # `make kind-images` loads the locally built image into the node. Without
        # IfNotPresent the injected ":latest" tag defaults to Always, which makes
        # the kubelet try (and fail) to pull target-http from a registry.
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: https
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        env:
        - name: CHAOS_TARGET_PROTOCOL
          value: "http1"
        - name: CHAOS_TARGET_PORT
          value: "8080"
        - name: CHAOS_TARGET_METRICS_PORT
          value: "9090"
        # TLS is enabled when both the certificate and the key are set. The
        # Secret is created by `make kind-secrets`.
        - name: CHAOS_TARGET_CERT_FILE
          value: "/certs/tls.crt"
        - name: CHAOS_TARGET_KEY_FILE
          value: "/certs/tls.key"
        volumeMounts:
        - name: tls
          mountPath: /certs
          readOnly: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        # The image is distroless, so the probes go over HTTPS to /health.
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: tls
        secret:
          secretName: target-tls
