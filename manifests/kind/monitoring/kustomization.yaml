apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# grafana-datasources.yaml and grafana-dashboards.yaml are generated by
# `make manifests` from monitoring/grafana/provisioning/, so the dashboards stay
# single-sourced.
resources:
  - prometheus-configmap.yaml
  - prometheus.yaml
  - grafana.yaml
  - grafana-datasources.yaml
  - grafana-dashboards.yaml
