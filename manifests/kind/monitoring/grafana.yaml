apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana
    project: chaos-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        project: chaos-generator
    spec:
      containers:
      - name: grafana
        # Pinned on purpose: `latest` silently changes Grafana's behaviour between
        # builds (13.2.2 is the version this deployment was verified against).
        image: grafana/grafana:13.2.2
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: "admin"
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "admin"
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        volumeMounts:
        # Both ConfigMaps are generated by `make manifests` from
        # monitoring/grafana/provisioning/.
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
          readOnly: true
        - name: dashboards
          mountPath: /etc/grafana/provisioning/dashboards
          readOnly: true
        - name: data
          mountPath: /var/lib/grafana
        # Interactive dashboards fan out into many PromQL queries at once. Under
        # that load Grafana's handlers can take seconds to answer, so it needs real
        # CPU: it was capped at 500m, which made /api/health miss the 1s probe
        # timeout and got the container liveness-killed while it was still working.
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "2000m"
        # /api/health is the right endpoint (unauthenticated, answering in well
        # under a millisecond when idle). These timings let it answer while the
        # instance is busy, instead of restarting a healthy Grafana.
        startupProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          # 6 x 30s = three minutes of consecutive failures before a restart.
          failureThreshold: 6
      # A busy Grafana can take a while to shut down; without this it was SIGKILLed
      # (exit code 137) instead of exiting cleanly.
      terminationGracePeriodSeconds: 60
      volumes:
      - name: datasources
        configMap:
          name: grafana-datasources
      - name: dashboards
        configMap:
          name: grafana-dashboards
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app: grafana
    project: chaos-generator
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: grafana
