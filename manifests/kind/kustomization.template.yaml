apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Rendered into manifests/generated by `make manifests`, which substitutes the
# __NAMESPACE__, __REGISTRY__ and __IMAGE_TAG__ placeholders below.
namespace: __NAMESPACE__

resources:
  - namespace.yaml
  - server
  - agent
  - target
  - monitoring

images:
  - name: chaos-master
    newName: __REGISTRY__chaos-master
    newTag: __IMAGE_TAG__
  - name: chaos-agent
    newName: __REGISTRY__chaos-agent
    newTag: __IMAGE_TAG__
  - name: target-http
    newName: __REGISTRY__target-http
    newTag: __IMAGE_TAG__
  - name: target-grpc
    newName: __REGISTRY__target-grpc
    newTag: __IMAGE_TAG__
