apiVersion: v1
kind: Service
metadata:
  name: chaos-agent-metrics
  labels:
    app: chaos-agent
    project: chaos-generator
spec:
  # Headless Service: Prometheus discovers every agent pod through its DNS
  # records, so none of the replicas are hidden behind a load-balanced VIP.
  clusterIP: None
  ports:
  - port: 9091
    targetPort: metrics
    protocol: TCP
    name: metrics
  selector:
    app: chaos-agent
