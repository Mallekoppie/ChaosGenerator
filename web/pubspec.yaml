name: chaos_master_web
description: "Chaos Master control panel (Flutter web over gRPC-Web)"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Routing
  go_router: ^16.0.0

  # gRPC-Web client (generated stubs live in lib/src/generated)
  grpc: ^5.1.0
  protobuf: ^6.0.0
  fixnum: ^1.1.0

  logger: ^2.6.0
  web: ^1.1.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  test: ^1.25.15

flutter:
  uses-material-design: true
