global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    monitor: 'chaos-generator'
    environment: 'docker-local'

scrape_configs:
  # Target HTTP Service - Non-TLS
  - job_name: 'target-http'
    static_configs:
      - targets: ['target-http:9090']
        labels:
          service: 'target-http'
          protocol: 'http1'
          tls: 'false'
          instance: 'target-http'

  # Target HTTP Service - TLS
  - job_name: 'target-http-tls'
    static_configs:
      - targets: ['target-http-tls:9093']
        labels:
          service: 'target-http'
          protocol: 'http1'
          tls: 'true'
          instance: 'target-http-tls'

  # Target HTTP/2 Service - TLS
  - job_name: 'target-http2'
    static_configs:
      - targets: ['target-http2:9094']
        labels:
          service: 'target-http'
          protocol: 'http2'
          tls: 'true'
          instance: 'target-http2'

  # Chaos Agent 1
  - job_name: 'chaos-agent-1'
    static_configs:
      - targets: ['chaos-agent-1:9096']
        labels:
          service: 'chaos-agent'
          agent_id: 'agent-1'
          instance: 'chaos-agent-1'

  # Chaos Agent 2
  - job_name: 'chaos-agent-2'
    static_configs:
      - targets: ['chaos-agent-2:9097']
        labels:
          service: 'chaos-agent'
          agent_id: 'agent-2'
          instance: 'chaos-agent-2'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
