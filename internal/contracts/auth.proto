syntax = "proto3";

package contract;

option go_package = "mallekoppie/ChaosGenerator/internal/contracts";

// Auth exposes local username/password authentication for the web UI.
// Login and Register are unauthenticated; every other method requires a
// valid local JWT supplied as "authorization: Bearer <token>" metadata.
service Auth {
    rpc Login(LoginRequest) returns (LoginResponse) {}
    // Named RegisterUser (not Register) so the generated Go method does not
    // collide with the Register(*grpc.Server) method required by goslow.
    rpc RegisterUser(RegisterRequest) returns (RegisterResponse) {}
    rpc GetAllUsers(GetAllUsersRequest) returns (GetAllUsersResponse) {}
    rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {}
}

message LoginRequest {
    string username = 1;
    string password = 2;
}

message LoginResponse {
    string token = 1;
    bool success = 2;
    string message = 3;
}

message RegisterRequest {
    string username = 1;
    string password = 2;
    string registerSecret = 3;
}

message RegisterResponse {
    string token = 1;
    bool success = 2;
    string message = 3;
}

message User {
    string id = 1;
    string username = 2;
    int64 createdAt = 3; // Unix timestamp
}

message GetAllUsersRequest {}

message GetAllUsersResponse {
    repeated User users = 1;
}

message DeleteUserRequest {
    string id = 1;
}

message DeleteUserResponse {
    bool success = 1;
    string message = 2;
}
