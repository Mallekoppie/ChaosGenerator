syntax = "proto3";

package contract;

option go_package = "mallekoppie/ChaosGenerator/internal/contracts";

service ChaosMaster {
    // Agent operations
    rpc RegisterAgent(RegisterAgentRequest) returns (RegisterAgentResponse) {}
    rpc ConnectAgent(stream AgentMessage) returns (stream AgentCommand) {}
    rpc GetAllAgents(GetAllAgentsRequest) returns (GetAllAgentsResponse) {}
    rpc UpdateAgent(UpdateAgentRequest) returns (UpdateAgentResponse) {}
    rpc DeleteAgent(DeleteAgentRequest) returns (DeleteAgentResponse) {}
    rpc ClearAllAgents(ClearAllAgentsRequest) returns (ClearAllAgentsResponse) {}
    
    // TestGroup operations
    rpc GetAllTestGroups(GetAllTestGroupsRequest) returns (GetAllTestGroupsResponse) {}
    rpc GetTestGroup(GetTestGroupRequest) returns (GetTestGroupResponse) {}
    rpc AddTestGroup(AddTestGroupRequest) returns (AddTestGroupResponse) {}
    rpc UpdateTestGroup(UpdateTestGroupRequest) returns (UpdateTestGroupResponse) {}
    rpc DeleteTestGroup(DeleteTestGroupRequest) returns (DeleteTestGroupResponse) {}
    
    // TestCollection operations
    rpc AddTestCollection(AddTestCollectionRequest) returns (AddTestCollectionResponse) {}
    rpc UpdateTestCollection(UpdateTestCollectionRequest) returns (UpdateTestCollectionResponse) {}
    rpc DeleteTestCollection(DeleteTestCollectionRequest) returns (DeleteTestCollectionResponse) {}
    
    // Target operations
    rpc RegisterTarget(RegisterTargetRequest) returns (RegisterTargetResponse) {}
    rpc UpdateTarget(UpdateTargetRequest) returns (UpdateTargetResponse) {}
    rpc DeleteTarget(DeleteTargetRequest) returns (DeleteTargetResponse) {}
    rpc GetAllTargets(GetAllTargetsRequest) returns (GetAllTargetsResponse) {}
    
    // Use case operations
    rpc GetUseCases(GetUseCasesRequest) returns (GetUseCasesResponse) {}
    
    // Test execution operations
    rpc StartTestExecution(StartTestExecutionRequest) returns (StartTestExecutionResponse) {}
    rpc StopTestExecution(StopTestExecutionRequest) returns (StopTestExecutionResponse) {}
    rpc GetRunningTests(GetRunningTestsRequest) returns (GetRunningTestsResponse) {}
}

// Agent messages
message Agent {
    string id = 1;
    string host = 2;
    int32 port = 3;
    int32 metricsPort = 4;
    bool enabled = 5;
    string status = 6;
}

message GetAllAgentsRequest {}

message GetAllAgentsResponse {
    repeated Agent agents = 1;
}

message UpdateAgentRequest {
    Agent agent = 1;
}

message UpdateAgentResponse {
    bool success = 1;
}

message DeleteAgentRequest {
    Agent agent = 1;
}

message DeleteAgentResponse {
    bool success = 1;
}

message ClearAllAgentsRequest {}

message ClearAllAgentsResponse {
    bool success = 1;
    string message = 2;
    int32 deletedCount = 3;
}

message RegisterAgentRequest {
    string hostname = 1;
    int32 port = 2;
    int32 metricsPort = 3;
    string version = 4;
}

message RegisterAgentResponse {
    string agentId = 1;
    bool success = 2;
    string message = 3;
}

// Agent streaming messages
message AgentMessage {
    string agentId = 1;
    oneof payload {
        AgentHeartbeat heartbeat = 2;
        CommandResponse response = 3;
    }
}

message AgentHeartbeat {
    int64 timestamp = 1;
}

message AgentCommand {
    string commandId = 1;
    oneof command {
        StartTestCommand startTest = 3;
        StopTestCommand stopTest = 4;
        GetVersionCommand getVersion = 7;
        HealthCheckCommand healthCheck = 9;
    }
}

message StartTestCommand {
    string testExecutionId = 1;
    string useCaseId = 2;
    string targetAddress = 3;
    string targetProtocol = 4;
    bool connectionReuseEnabled = 5;
    int32 simulatedUsers = 6;
}

message StopTestCommand {
    string testExecutionId = 1;
}

message GetVersionCommand {}

message HealthCheckCommand {}

message CommandResponse {
    string commandId = 1;
    bool success = 2;
    string error = 3;
    oneof result {
        VersionResult versionResult = 5;
    }
}

message VersionResult {
    string version = 1;
    string hostname = 2;
}

// TestGroup messages
message MasterHeader {
    string id = 1;
    string name = 2;
    string value = 3;
}

message MasterTest {
    string id = 1;
    string name = 2;
    string method = 3;
    string url = 4;
    string body = 5;
    repeated MasterHeader headers = 6;
    int32 responseCode = 7;
    string responseBody = 8;
}

message MasterTestCollection {
    string id = 1;
    string name = 2;
    string description = 3;
    repeated MasterTest tests = 4;
    string groupId = 5;
}

message TestGroup {
    string id = 1;
    string name = 2;
    string description = 3;
    repeated MasterTestCollection testCollections = 4;
}

message GetAllTestGroupsRequest {}

message GetAllTestGroupsResponse {
    repeated TestGroup testGroups = 1;
}

message GetTestGroupRequest {
    string id = 1;
}

message GetTestGroupResponse {
    TestGroup testGroup = 1;
}

message AddTestGroupRequest {
    TestGroup testGroup = 1;
}

message AddTestGroupResponse {
    bool success = 1;
}

message UpdateTestGroupRequest {
    TestGroup testGroup = 1;
}

message UpdateTestGroupResponse {
    bool success = 1;
}

message DeleteTestGroupRequest {
    string id = 1;
}

message DeleteTestGroupResponse {
    bool success = 1;
}

// TestCollection messages
message AddTestCollectionRequest {
    MasterTestCollection testCollection = 1;
}

message AddTestCollectionResponse {
    bool success = 1;
    string error = 2;
}

message UpdateTestCollectionRequest {
    MasterTestCollection testCollection = 1;
}

message UpdateTestCollectionResponse {
    bool success = 1;
    string error = 2;
}

message DeleteTestCollectionRequest {
    string id = 1;
}

message DeleteTestCollectionResponse {
    bool success = 1;
}

// Target messages
message Target {
    string id = 1;
    string name = 2;
    string address = 3;
    string serviceType = 4; // "http/1.1", "http/2", "grpc"
    string protocol = 5; // "http", "https", "grpc"
    bool connectionReuseEnabled = 6;
}

message RegisterTargetRequest {
    Target target = 1;
}

message RegisterTargetResponse {
    string targetId = 1;
    bool success = 2;
    string message = 3;
}

message UpdateTargetRequest {
    Target target = 1;
}

message UpdateTargetResponse {
    bool success = 1;
    string message = 2;
}

message DeleteTargetRequest {
    string id = 1;
}

message DeleteTargetResponse {
    bool success = 1;
    string message = 2;
}

message GetAllTargetsRequest {}

message GetAllTargetsResponse {
    repeated Target targets = 1;
}

// Use case messages
message UseCase {
    string id = 1;
    string name = 2;
    string path = 3;
    string method = 4;
    string description = 5;
}

message GetUseCasesRequest {}

message GetUseCasesResponse {
    repeated UseCase useCases = 1;
}

// Test execution messages
message StartTestExecutionRequest {
    string useCaseId = 1;
    string targetId = 2;
    int32 simulatedUsersPerAgent = 3;
    string agentSelection = 4; // "all" or comma-separated IDs
}

message StartTestExecutionResponse {
    string testExecutionId = 1;
    bool success = 2;
    string message = 3;
}

message StopTestExecutionRequest {
    string testExecutionId = 1;
}

message StopTestExecutionResponse {
    bool success = 1;
    string message = 2;
}

message GetRunningTestsRequest {}

message GetRunningTestsResponse {
    repeated RunningTestExecution tests = 1;
}

message RunningTestExecution {
    string testExecutionId = 1;
    string useCaseId = 2;
    string useCaseName = 3;
    string targetId = 4;
    string targetName = 5;
    int32 simulatedUsersPerAgent = 6;
    int32 numberOfAgents = 7;
    int64 startTime = 8; // Unix timestamp
}
